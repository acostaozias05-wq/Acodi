/* Neon Dark Digital Y2K: la paleta oscura es la identidad de la campaña en ambos modos del visor. */
:root{
  color-scheme:dark;
  --bg:#05060f; --panel:#10132f; --panel2:#171a40; --line:#262b60;
  --cyan:#00f0ff; --mag:#ff2bd6; --vio:#9664ff; --acid:#b6ff3b;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

  :root:not([data-theme="light"]){--bg:#05060f;--panel:#10132f;--panel2:#171a40;--line:#262b60;--text:#f2f6ff;--muted:#a6aed3;--userbg:#3a0a38;--hl:#a8fbff}
}
:root[data-theme="dark"]{--bg:#05060f;--panel:#10132f;--panel2:#171a40;--line:#262b60;--text:#f2f6ff;--muted:#a6aed3;--userbg:#3a0a38;--hl:#a8fbff}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"Space Grotesk AE","Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:
    radial-gradient(120% 55% at 50% -8%, rgba(150,100,255,.24), transparent 62%),
    radial-gradient(80% 40% at 100% 100%, rgba(255,43,214,.10), transparent 70%),
    linear-gradient(rgba(150,100,255,.065) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, rgba(150,100,255,.065) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg)}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.16) 3px 4px)}
.px{position:absolute;width:6px;height:6px;pointer-events:none;z-index:0;opacity:.5;animation:drift 14s linear infinite}

.top{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 16px 10px;background:rgba(5,6,15,.92)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--panel2);border:2px solid var(--cyan);box-shadow:0 0 14px rgba(0,240,255,.6)}
.av img{width:40px;height:auto;display:block}
.name{font:900 18px/1 "Orbitron AE","Orbitron",system-ui,sans-serif;letter-spacing:.09em;text-shadow:0 0 10px rgba(0,240,255,.6)}
.status{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acid);box-shadow:0 0 8px var(--acid)}
.restart{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);font-size:20px;cursor:pointer}
.restart:hover{border-color:var(--cyan)}

.tabs{position:relative;z-index:3;display:flex;gap:6px;padding:0 14px 10px;background:rgba(5,6,15,.92);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,240,255,.28),0 8px 22px rgba(0,0,0,.4)}
.tab{flex:1;padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);
  font-weight:700;font-size:14.5px;cursor:pointer}
.tab[aria-selected="true"]{color:#fff;border-color:var(--cyan);background:rgba(0,240,255,.10);box-shadow:0 0 12px rgba(0,240,255,.3)}
.tab .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--mag);color:#fff;vertical-align:1px}

.log{position:relative;z-index:1;flex:1;overflow-y:auto;padding:4px 14px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.log[hidden]{display:none}
.hero{text-align:center;padding:16px 6px 2px}
.hero img{width:min(160px,42vw);height:auto;filter:drop-shadow(0 0 22px rgba(0,240,255,.4));animation:float 4.2s ease-in-out infinite}
.hero h1{margin:8px 0 6px;font:900 24px/1.12 "Orbitron AE","Orbitron",system-ui,sans-serif;letter-spacing:.03em;color:#fff;
  text-shadow:0 0 10px var(--cyan),0 0 26px rgba(0,240,255,.45)}
.hero h1 span{color:#ffd6f6;text-shadow:0 0 10px var(--mag),0 0 26px rgba(255,43,214,.45)}
.hero p{margin:0;font-size:13px;color:var(--muted);letter-spacing:.02em}
.hero p b{font-weight:600}.hero .a{color:#ff9cec}.hero .b{color:var(--hl)}.hero .c{color:#cdb8ff}

.row{display:flex;gap:10px;align-items:flex-end;margin:10px 0;animation:pop .28s ease-out both}
.row.user{justify-content:flex-end}
.mini{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--panel2);border:1.5px solid var(--cyan);box-shadow:0 0 10px rgba(0,240,255,.45)}
.mini img{width:29px;height:auto}
.mini.ghost{visibility:hidden}
.bubble{max-width:84%;padding:12px 14px;border-radius:18px 18px 18px 6px;line-height:1.45;font-size:16px;overflow-wrap:anywhere;
  background:rgba(16,19,47,.94);border:1.5px solid rgba(0,240,255,.55);box-shadow:0 0 16px rgba(0,240,255,.13),inset 0 0 18px rgba(0,240,255,.05)}
.bubble.ai{white-space:pre-wrap}
.row.user .bubble{border-radius:18px 18px 6px 18px;background:var(--userbg);border-color:rgba(255,43,214,.75);box-shadow:0 0 16px rgba(255,43,214,.2);white-space:pre-wrap}
.bubble b{color:var(--hl);font-weight:700}
.bubble ul,.bubble ol{margin:8px 0 2px;padding-left:20px}
.bubble li{margin:5px 0}
.bubble .src{display:block;margin-top:8px;font-size:12.5px;color:var(--muted)}
.bubble.think{border-color:rgba(182,255,59,.6);background:rgba(20,30,20,.55);box-shadow:0 0 14px rgba(182,255,59,.15)}
.bubble.think .k{display:block;margin-bottom:4px;font:900 11.5px/1 "Orbitron AE","Orbitron",system-ui,sans-serif;letter-spacing:.12em;color:var(--acid)}
.bubble.alert{border-color:rgba(255,43,214,.9);box-shadow:0 0 18px rgba(255,43,214,.3)}
.bubble.note{border-color:var(--line);background:rgba(16,19,47,.85);box-shadow:none;font-size:14.5px;color:#d9def5}
.bubble .meta{display:block;margin-top:8px;font-size:12.5px;color:var(--muted)}
.lemab{display:flex;flex-direction:column;gap:4px;font:900 17px/1.2 "Orbitron AE","Orbitron",system-ui,sans-serif;letter-spacing:.04em}
.lemab .l1{color:#ffc4f3;text-shadow:0 0 10px var(--mag)}.lemab .l2{color:#bffcff;text-shadow:0 0 10px var(--cyan)}.lemab .l3{color:#dccdff;text-shadow:0 0 10px var(--vio)}
.act{display:block;margin-top:10px;padding:11px 14px;border-radius:12px;text-align:center;text-decoration:none;font-weight:700;font-size:15px;
  color:#04121a;background:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.45)}
.act .num{display:block;margin-top:2px;font-weight:500;font-size:13.5px;white-space:nowrap;opacity:.85}
.act.hot{color:#fff;background:var(--mag);box-shadow:0 0 16px rgba(255,43,214,.5)}
.act:focus-visible,.chip:focus-visible,.sos:focus-visible,.restart:focus-visible,.tab:focus-visible,.send:focus-visible{outline:3px solid #fff;outline-offset:2px}

.typing .bubble{padding:14px 16px}
.dots{display:inline-flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:blink 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--mag)}.dots i:nth-child(3){animation-delay:.3s;background:var(--vio)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px 44px;animation:pop .3s ease-out both}
.chip{font:600 15px/1.25 "Space Grotesk AE","Space Grotesk",system-ui,sans-serif;color:var(--text);cursor:pointer;padding:10px 14px;border-radius:16px;
  background:rgba(23,26,64,.92);border:1.5px solid var(--vio);box-shadow:0 0 10px rgba(150,100,255,.25);text-align:left}
.chip:hover{border-color:var(--cyan)}
.chip.hot{border-color:var(--mag);color:#ffd6f6;box-shadow:0 0 12px rgba(255,43,214,.35)}
.chip.go{border-color:var(--cyan);color:#d6fdff}
.chip small{display:block;margin-top:2px;font-weight:500;font-size:12.5px;color:var(--muted)}

.bottom{position:relative;z-index:3;padding:10px 14px 12px;background:rgba(5,6,15,.94);border-top:1px solid var(--line)}
.composer{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.composer[hidden]{display:none}
.composer textarea{flex:1;resize:none;min-height:46px;max-height:120px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--text);font:16px/1.35 "Space Grotesk AE","Space Grotesk",system-ui,sans-serif}
.composer textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.3)}
.composer textarea::placeholder{color:#7d86b3}
.send{flex:none;height:46px;min-width:46px;padding:0 14px;border-radius:14px;border:0;cursor:pointer;font-weight:700;font-size:15px;
  color:#04121a;background:var(--cyan);box-shadow:0 0 14px rgba(0,240,255,.45)}
.send.stop{background:var(--panel2);color:var(--text);border:1.5px solid var(--mag);box-shadow:none}
.send:disabled{opacity:.45;cursor:default}
.sos{width:100%;padding:13px;border:0;border-radius:14px;cursor:pointer;font:700 16px "Space Grotesk AE","Space Grotesk",system-ui,sans-serif;color:#fff;
  background:linear-gradient(90deg,var(--mag),var(--vio));box-shadow:0 0 18px rgba(255,43,214,.45)}
.priv{margin:8px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.modebar{position:sticky;top:-4px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px -14px 6px;padding:10px 14px 8px;
  background:var(--bg);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.modebar .mode{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--text)}
.modebar .mode i{width:8px;height:8px;border-radius:50%;background:var(--vio);box-shadow:0 0 8px var(--vio)}
.modebar .mode.ia i{background:var(--acid);box-shadow:0 0 8px var(--acid)}
.modebtn{min-height:40px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--cyan);background:rgba(0,240,255,.08);color:#d6fdff;
  font:700 13.5px "Space Grotesk AE","Space Grotesk",system-ui,sans-serif;cursor:pointer}
.modebtn[hidden]{display:none}
.modebtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.prog{display:block;height:8px;margin:10px 0 2px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));transition:width .3s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-110vh)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

const CAT_OF = {};
CATS.forEach(c => c.q.forEach(id => { CAT_OF[id] = c.id; }));
const asked = new Set();

/* ------------------------------------------------------------------ utilidades de chat */
const paneQ = document.getElementById('paneQ');
const paneC = document.getElementById('paneC');
const scrollDown = el => el.scrollTo({ top: el.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
function botRow(html, first, cls) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<div class="mini' + (first ? '' : ' ghost') + '" aria-hidden="true"><img src="' + HEAD + '" alt=""></div><div class="bubble' + (cls ? ' ' + cls : '') + '">' + html + '</div>';
  return row;
}
function userRow(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  return row;
}
function typingRow() {
  const t = document.createElement('div');
  t.className = 'row typing';
  t.innerHTML = '<div class="mini" aria-hidden="true"><img src="' + HEAD + '" alt=""></div><div class="bubble"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="sr">Acodi está escribiendo</span></div>';
  return t;
}

/* ------------------------------------------------------------------ modo preguntas */
let busy = false, run = 0;
async function say(html, first, my, cls) {
  const t = typingRow();
  paneQ.appendChild(t); scrollDown(paneQ);
  const len = html.replace(/<[^>]+>/g, '').length;
  await wait(Math.min(1300, Math.max(450, 300 + len * 7)));
  t.remove();
  if (my !== run) return;
  paneQ.appendChild(botRow(html, first, cls)); scrollDown(paneQ);
}
function chips(items) {
  const box = document.createElement('div');
  box.className = 'chips';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (it.cls ? ' ' + it.cls : '');
    b.innerHTML = it.html;
    b.addEventListener('click', it.on);
    box.appendChild(b);
  });
  paneQ.appendChild(box); scrollDown(paneQ);
}
function txt(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
const catChips = () => CATS.map(c => ({ html: txt(c.t) + '<small>' + c.q.length + ' preguntas</small>', on: () => openCat(c.id) }))
  .concat([{ html: 'Escribirle a Acodi con mis palabras', cls: 'go', on: () => setTab('C') }]);
async function flow(label, msgs, next, force) {
  if (busy && !force) return;
  const my = ++run;
  busy = true;
  paneQ.querySelectorAll('.chips, .row.typing').forEach(c => c.remove());
  if (label) { paneQ.appendChild(userRow(label)); scrollDown(paneQ); await wait(250); }
  for (let i = 0; i < msgs.length; i++) {
    if (my !== run) return;
    const m = typeof msgs[i] === 'string' ? { h: msgs[i] } : msgs[i];
    await say(m.h, i === 0, my, m.c);
  }
  if (my !== run) return;
  chips(next());
  busy = false;
}
function start() {
  flow(null, [
    '¡Hola! Soy <b>Acodi</b>, el asistente de la campaña <b>Algoritmo de Empatía</b>.',
    'Aquí tienes <b>42 preguntas</b> para entender el ciberacoso, saber qué hacer si lo ves o si te está pasando, y cuidarte.',
    'Elige un tema para empezar:'
  ], catChips);
}
function openCat(id) {
  const c = CATS.find(x => x.id === id);
  flow(c.t, ['Estas son las preguntas sobre <b>' + txt(c.t.toLowerCase()) + '</b>:'], () =>
    c.q.map(q => ({ html: txt(Q[q].t), cls: Q[q].alert ? 'hot' : '', on: () => ask(q) }))
      .concat([{ html: 'Ver otros temas', on: () => menu() }]));
}
function menu() { flow('Ver otros temas', ['¿Sobre qué más quieres hablar?'], catChips); }
function ask(id) {
  asked.add(id);
  const item = Q[id];
  const msgs = item.a.map(h => ({ h: h }));
  if (item.p) msgs.push({ h: '<span class="k">PARA PENSAR</span>' + txt(item.p), c: 'think' });
  const c = CATS.find(x => x.id === CAT_OF[id]);
  flow(item.t, msgs, () => {
    const rest = c.q.filter(q => !asked.has(q)).slice(0, 3)
      .map(q => ({ html: txt(Q[q].t), cls: Q[q].alert ? 'hot' : '', on: () => ask(q) }));
    const out = rest.concat([{ html: 'Ver otros temas', on: () => menu() }]);
    if (item.alert) out.unshift({ html: 'Necesito ayuda ahora', cls: 'hot', on: () => help() });
    else out.push({ html: 'Escribirle a Acodi con mis palabras', cls: 'go', on: () => setTab('C') });
    return out;
  }, id === 'dano');
}

const norm = s => ' ' + s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ]+/g, ' ').trim() + ' ';

function rank(text) {
  const n = norm(text);
  return Object.keys(KW).map(id => {
    let s = 0;
    KW[id].forEach(k => { if (hasKey(n, k)) s += k.split(' ').length; });
    return { id: id, s: s };
  }).filter(r => r.s > 0).sort((a, b) => b.s - a.s);
}

function yesNo(n) {
  const t = n.trim();
  if (/^(no se|nose|tal vez|quizas|quiza|mas o menos|creo que si|creo que no|no estoy segur)( |$)/.test(t)) return 'maybe';
  if (/^(si+|sip|claro|ok|okey|okay|dale|vale|bueno|aja|de acuerdo|por favor|porfa|correcto|exacto|obvio)( |$)/.test(t)) return 'yes';
  if (/^(no|nop|nel|nunca|todavia no|aun no|para nada)( |$)/.test(t)) return 'no';
  return null;
}
function extract(n, prevAsk) {
  const got = { rol: null, tipos: [], emo: [], adulto: null };
  Object.keys(TIPO).forEach(t => { if (!S.tipos.has(t) && anyKey(n, TIPO[t])) { S.tipos.add(t); got.tipos.push(t); } });
  if (!S.rol || prevAsk === 'rol') {
    let pick = null, top = 0;
    ['autor', 'victima', 'testigo'].forEach(r => { const s = best(n, ROL[r]); if (s > top) { top = s; pick = r; } });
    if (!pick && prevAsk === 'rol' && /^ yo /.test(n)) pick = 'autor';
    if (!pick && !S.rol && S.tipos.size && / (me|mi|mis) /.test(n)) pick = 'victima';
    if (pick && pick !== S.rol) { S.rol = pick; got.rol = pick; }
  }
  Object.keys(EMO).forEach(e => { if (!S.emo.has(e) && anyKey(n, EMO[e])) { S.emo.add(e); got.emo.push(e); } });
  if (anyKey(n, ADULTO_NO)) { if (S.adulto !== false) got.adulto = false; S.adulto = false; }
  else if (anyKey(n, ADULTO_SI)) { if (S.adulto !== true) got.adulto = true; S.adulto = true; }

}

function nextAsk() {
  if (!S.rol && !S.skipped.has('rol')) return 'rol';
  if (S.rol === 'victima' || S.rol === 'testigo') {
    if (!S.tipos.size && !S.skipped.has('tipo')) return 'tipo';
    if (S.adulto === null && !S.skipped.has('adulto')) return 'adulto';
  }
  if ((S.rol === 'victima' || S.rol === 'autor') && !S.emo.size && !S.skipped.has('emo')) return 'emo';

}
function candidates() {
  const plan = PLAN[S.rol || 'consulta'], out = [];
  [...S.tipos].forEach(t => (plan[t] || []).forEach(id => out.push(id)));
  if (S.adulto === false) out.push(...(S.rol === 'testigo' ? ['acudo', 'liceo'] : ['contar', 'liceo']));
  [...S.emo].forEach(e => out.push(e === 'culpa' && S.rol === 'autor' ? 'disculpa' : EMO_Q[e]));
  (plan._ || []).forEach(id => out.push(id));

}
const isQuestion = (text, n) => /\?/.test(text) || /^ (que|como|cuando|donde|por que|porque|puedo|debo|es|se puede|quien|a quien|cual) /.test(n);
function pickAnswer(text, n, got) {
  let c = [];
  const q = isQuestion(text, n);
  if (q || !hasInfo(got)) rank(text).forEach(r => c.push(r.id));
  /* si ya se conoce la situación, una frase sin datos nuevos ("quiero que pare") recibe el siguiente paso útil */
  if ((q || !hasInfo(got)) && S.rol) candidates().forEach(id => c.push(id));
  if (got.adulto === false) c.push(S.rol === 'testigo' ? 'acudo' : 'contar');
  got.tipos.forEach(t => (PLAN[S.rol || 'victima'][t] || []).forEach(id => c.push(id)));
  got.emo.forEach(e => c.push(e === 'culpa' && S.rol === 'autor' ? 'disculpa' : EMO_Q[e]));
  /* "qué hago" significa algo distinto para quien ve el acoso o para quien lo hizo */
  if (S.rol === 'testigo' || S.rol === 'autor') c = c.flatMap(id => id === 'primero' ? candidates() : [id]);
  return c.find(id => Q[id] && !S.shown.has(id)) || null;
}
function reflection(got) {
  const out = [];
  if (got.rol === 'victima') out.push('Siento mucho que estés pasando por esto. Hiciste bien en contármelo.');
  if (got.rol === 'testigo') out.push('Qué bueno que te importe lo que le pasa a esa persona. Fijarte ya es un primer paso.');
  if (got.rol === 'autor') out.push('Gracias por contarlo con sinceridad. Reconocer que hiciste daño es el primer paso para repararlo.');
  if (S.rol !== 'autor') got.tipos.forEach(t => out.push((S.rol === 'testigo' ? TIPO_OTRO : TIPO_YO)[t]));
  got.emo.forEach(e => out.push(e === 'culpa' && S.rol !== 'autor' ? 'Y no: no es tu culpa.' : EMO_TXT[e]));
  if (got.adulto === true) out.push(S.rol === 'testigo' ? 'Muy bien: que un adulto lo sepa ayuda mucho.' : 'Muy bien. Contárselo a un adulto es un paso valiente.');
  if (got.adulto === false) out.push(S.rol === 'testigo' ? 'Avisar a un adulto del liceo puede ayudar a frenarlo sin exponerte.' : 'Entiendo que contarlo da miedo o pena, pero un adulto de confianza puede ayudarte a frenar esto.');

async function guidedTurn(text, n, got, prevAsk, my) {
  const yn = yesNo(n), parts = [];
  let answer = null;
  const thanks = /\bgracias\b/.test(n) && yn !== 'no';
  const hello = /^ (hola|holi|buenas|buenos dias|buenas tardes|buenas noches|hey|que tal|saludos)/.test(n);
  const bye = /\b(chao|chau|adios|nos vemos|bye|hasta luego|hasta manana)\b/.test(n);
  if (prevAsk === 'offer' && S.offer) {
    if (yn === 'yes') answer = S.offer;
    else if (yn === 'no') { parts.push('De acuerdo.'); S.shown.add(S.offer); }
    S.offer = null;
  }
  if (prevAsk === 'adulto' && S.adulto === null && (yn === 'yes' || yn === 'no')) { S.adulto = yn === 'yes'; got.adulto = S.adulto; }
  if ((prevAsk === 'more' && yn === 'no' && !hasInfo(got)) || (bye && !hasInfo(got))) return closing(my);
  if (['rol', 'tipo', 'adulto', 'emo'].includes(prevAsk)) {
    const empty = { rol: !S.rol, tipo: !S.tipos.size, adulto: S.adulto === null, emo: !S.emo.size }[prevAsk];
    if (empty) S.skipped.add(prevAsk);
    if (prevAsk === 'emo' && empty && !hasInfo(got)) parts.push('Gracias por contármelo.');
  }
  if (hello && !hasInfo(got)) parts.push('¡Hola! Me alegra que escribas. Cuéntame qué está pasando.');
  if (thanks && !hasInfo(got)) parts.push('¡Con gusto! Estoy aquí cuando lo necesites.');
  if (prevAsk === 'more' && yn === 'yes' && !hasInfo(got)) parts.push('Te escucho. Cuéntame.');
  const refl = reflection(got);
  if (refl) parts.push(refl);
  /* un saludo, un "gracias" o un "sí/no" sin datos nuevos no necesita otra explicación */
  const corto = n.trim().split(/\s+/).length <= 3;
  if (!answer && (hasInfo(got) || !corto || !(thanks || hello || yn))) answer = pickAnswer(text, n, got);
  if (!parts.length && answer && !yn && !hasInfo(got) && S.rol && !isQuestion(text, n)) parts.push('Te entiendo. Esto puede ayudarte:');
  if (!parts.length && !answer && !yn) parts.push('No estoy seguro de haberte entendido. ¿Me lo cuentas con otras palabras?');
  if (parts.length && !(await sayC(parts.join(' '), true, my))) return;
  if (answer && !(await answerC(answer, my))) return;
  if (prevAsk === 'more' && yn === 'yes' && !hasInfo(got)) { S.ask = null; return; }
  await askNext(my);
}

      }
      if (blocked) { try { AI.engine.interruptGenerate(); } catch (e) { /* nada */ } break; }
    }
    if (!blocked && buf.trim() && my === convo) { if (badOut(buf)) blocked = true; else emit(buf); }
  } catch (e) {
    blocked = true;
    if (/device|lost|gpu|memory/i.test(String(e && e.message))) { AI.state = 'error'; AI.mode = 'guiado'; AI.engine = null; modebar(); }
  }
  setGen(false);
  t.remove();
  if (my !== convo) return true;
  if (blocked || !shown.trim()) { row.remove(); return false; }
  turnOut.push(shown.trim());
  return true;
}

/* ------------------------------------------------------------------ envío de mensajes */
async function send(text) {
  text = (text || '').trim();
  if (!text || busyC) return false;
  busyC = true;
  const my = convo;
  paneC.querySelectorAll('.chips').forEach(c => c.remove());
  cAppend(userRow(text));
  S.turns++;
  turnOut = [];
  histAdd('user', text);
  const n = norm(text);
  const prevAsk = S.ask;
  const got = extract(n, prevAsk);
  if (!(await riskTurn(n, my))) {
    let ok = false;
    if (AI.mode === 'ia' && AI.state === 'ready') {
      S.ask = null; S.offer = null;
      ok = await aiReply(text, my);
    }
    if (!ok && my === convo) await guidedTurn(text, n, got, prevAsk, my);
  }
  if (my === convo) histAdd('assistant', turnOut.join(' '));
  busyC = false;
  return true;
}
composer.addEventListener('submit', ev => {
  ev.preventDefault();
  if (AI.gen) { try { AI.engine.interruptGenerate(); } catch (e) { /* nada */ } return; }
  if (busyC) return;
  const v = msg.value; msg.value = ''; autosize(); send(v);
});
msg.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && !matchMedia('(pointer: coarse)').matches) { ev.preventDefault(); composer.requestSubmit(); }
});
function autosize() { msg.style.height = 'auto'; msg.style.height = Math.min(120, msg.scrollHeight) + 'px'; }
msg.addEventListener('input', autosize);

async function chatIntro() {
  convo++; busyC = false; resetState(); HIST.length = 0; turnOut = [];
  if (AI.gen) { try { AI.engine.interruptGenerate(); } catch (e) { /* nada */ } setGen(false); }
  paneC.innerHTML = '<div class="modebar"><span class="mode"><i aria-hidden="true"></i>Modo guiado</span><button class="modebtn" type="button" hidden>Activar modo IA</button></div>';
  paneC.querySelector('.modebtn').addEventListener('click', () => {
    if (AI.state === 'ready') { AI.mode = AI.mode === 'ia' ? 'guiado' : 'ia'; modebar(); cAppend(botRow(AI.mode === 'ia' ? 'Volvimos al <b>modo IA</b>.' : 'Ahora estoy en <b>modo guiado</b>: respondo con la información que preparó el equipo de la campaña.', true, 'note')); }
    else { AI.state = 'idle'; aiActivate(); }
  });
  modebar();
  cAppend(botRow('Escríbeme con tus palabras lo que estás viviendo, viendo o sintiendo. Te escucho, y vamos viendo juntos qué hacer.', true));
  cAppend(botRow('No soy una persona ni un psicólogo, así que también es importante que hables con un adulto de confianza. Lo que escribes se queda en tu teléfono: no se envía ni se guarda en ningún lugar.', false, 'note'));
  chipsC(qr(['Me están molestando en un grupo', 'Vi algo feo sobre un compañero', 'Me siento mal y no sé con quién hablar', 'Creo que lastimé a alguien']));
  const my = convo;
  if (!AI.support) AI.support = await aiCheck();
  if (my !== convo) return;
  modebar();
  if (!AI.support.ok || AI.state === 'ready' || AI.state === 'loading') return;
  if (store.get('acodi-ia') === 'on') aiActivate();
  else aiCard();
}

/* ------------------------------------------------------------------ pestañas y botones globales */
let current = 'Q', chatStarted = false;
function setTab(which) {
  current = which;
  document.getElementById('tabQ').setAttribute('aria-selected', which === 'Q');
  document.getElementById('tabC').setAttribute('aria-selected', which === 'C');
  paneQ.hidden = which !== 'Q';
  paneC.hidden = which !== 'C';
  composer.hidden = which !== 'C';
  if (which === 'C' && !chatStarted) { chatStarted = true; chatIntro(); }
  if (which === 'C') scrollDown(paneC); else scrollDown(paneQ);
}
document.getElementById('tabQ').addEventListener('click', () => setTab('Q'));
document.getElementById('tabC').addEventListener('click', () => setTab('C'));
document.getElementById('sos').addEventListener('click', () => {
  if (current === 'C') { S.lastAlert = S.turns; crisisCard(); }
  else help();
});
document.getElementById('restart').addEventListener('click', () => {
  if (current === 'C') { chatIntro(); }
  else {
    run++; busy = false; asked.clear();
    paneQ.querySelectorAll('.row, .chips').forEach(n => n.remove());
    paneQ.scrollTo({ top: 0 });
    start();
  }
});
/* ------------------------------------------------------------------ arranque */
const app = document.querySelector('.app');
const cols = ['var(--cyan)', 'var(--mag)', 'var(--vio)'];
for (let i = 0; i < 14; i++) {
  const p = document.createElement('span');
  p.className = 'px';
  p.style.left = Math.random() * 100 + '%';
  p.style.top = 100 + Math.random() * 30 + '%';
  p.style.background = cols[i % 3];
  p.style.animationDelay = -Math.random() * 14 + 's';
  p.style.animationDuration = 10 + Math.random() * 10 + 's';
  app.appendChild(p);
}
start();
</script>
